name = "lyneqo-zyfy-proxy"
main = "src/index.js"
compatibility_date = "2026-11-02"

# Production custom domain. Cloudflare manages DNS and the certificate.
[[routes]]
pattern = "api.lyneqo.com"
custom_domain = true

[[ratelimits]]
name = "LOOKUP_LIMITER"
namespace_id = "1027"
  [ratelimits.simple]
  limit = 10
  period = 60
